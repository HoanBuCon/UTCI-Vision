# 27 lớp biển báo của mô hình — thứ tự id = data.yaml của processed/<version> (scripts/data.py split ghi ra).
# raw_ids   : id lớp trong dataset gốc Roboflow (32 lớp) gộp vào lớp này. 6 lớp < 60 cảnh độc lập
#             (5, 11, 12, 22, 25, 27) gộp vào "Biển báo khác" (ADR-009) — gỡ khỏi danh sách khi đủ dữ liệu.
# superclass: prohibitory (Cấm, viền đỏ tròn) | warning (Nguy hiểm, tam giác vàng viền đỏ)
#             mandatory (Hiệu lệnh, tròn nền xanh) | info (Chỉ dẫn, chữ nhật nền xanh) | other (lớp gộp)
# qcvn      : mã biển theo QCVN 41:2019/BGTVT            — TV5 đã điền & xác nhận (25/10/2026)
# meaning   : ý nghĩa hiển thị trên web (1–2 câu)          — TODO(TV4) viết nội dung
# has_value : biển có số cần đọc (CV cắt vùng số + VietOCR + regex), value_unit là đơn vị
# has_text  : biển chính thường có chữ cần OCR (VietOCR)   — TV5 đã xác nhận trên contact-sheet
# Biển phụ được tìm cho MỌI lớp (cấu hình ở configs/ocr.yaml > sub_sign).
superclasses:
  prohibitory: {name_vi: "Biển cấm", color: red, shape: circle}
  warning: {name_vi: "Biển nguy hiểm", color: yellow, shape: triangle}
  mandatory: {name_vi: "Biển hiệu lệnh", color: blue, shape: circle}
  info: {name_vi: "Biển chỉ dẫn", color: blue, shape: rectangle}
  other: {name_vi: "Biển báo khác", color: gray, shape: mixed}   # lớp gộp — không đọc số/chữ

